name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Formula/**'
      - '**.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # SDK Package.swift is swift-tools-version 6.2 (Xcode 26). macos-15 is
    # Xcode 16.4 / Swift 6.1; macos-14 is Xcode 15 / Swift 5.10.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      RCLI_SDK_SWIFT_PATH: ${{ github.workspace }}/.deps/runanywhere-sdks
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout SDK Swift tree (MLX runtime)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: RunanywhereAI/runanywhere-sdks
          ref: v0.20.29
          path: .deps/runanywhere-sdks
      - name: Install ninja
        run: brew install ninja
      - name: Download C++ desktop kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kit="${GITHUB_WORKSPACE}/kit"
          bash scripts/fetch-kit.sh macos-arm64 "$kit"
          if [[ ! -f "$kit/include/runanywhere/proto/model_types.pb.h" ]]; then
            echo "kit missing generated proto headers; listing prefix:" >&2
            find "$kit" -maxdepth 4 -type d -print >&2
            exit 1
          fi
          if [[ ! -f "$kit/share/runanywhere/SCHEMA_LOCK" ]]; then
            echo "kit missing share/runanywhere/SCHEMA_LOCK" >&2
            find "$kit/share" -print >&2
            exit 1
          fi
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/kit"
      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.logicalcpu)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Product e2e (MLX host)
        env:
          RCLI_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/e2e.sh ./build/rcli

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Download C++ desktop kit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          kit="${GITHUB_WORKSPACE}/kit"
          bash scripts/fetch-kit.sh windows-x64 "$kit"
          test -f "$kit/include/runanywhere/proto/model_types.pb.h"
      - name: Configure
        shell: bash
        run: |
          prefix="${GITHUB_WORKSPACE}/kit"
          if command -v cygpath >/dev/null 2>&1; then
            prefix="$(cygpath -m "$prefix")"
          fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
      - name: Build
        run: cmake --build build --config Release
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Smoke
        shell: bash
        env:
          RCLI_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/e2e.sh ./build/rcli.exe
