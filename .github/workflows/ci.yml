name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Formula/**'
      - '**.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: ${{ vars.RCLI_PINNED_SDK_VERSION || '0.20.25' }}

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: brew install ninja
      - name: Download C++ desktop kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="RunAnywhere-cpp-desktop-macos-arm64-v${SDK_VERSION}.tar.gz"
          gh release download "v${SDK_VERSION}" \
            --repo RunanywhereAI/runanywhere-sdks \
            --pattern "$asset" --dir /tmp/kit
          mkdir -p "$HOME/kit"
          tar xzf "/tmp/kit/$asset" -C "$HOME/kit" --strip-components=1
          if [[ ! -f "$HOME/kit/include/runanywhere/proto/model_types.pb.h" ]]; then
            echo "kit missing generated proto headers; listing prefix:" >&2
            find "$HOME/kit" -maxdepth 4 -type d -print >&2
            exit 1
          fi
          if [[ ! -f "$HOME/kit/share/runanywhere/SCHEMA_LOCK" ]]; then
            echo "kit missing share/runanywhere/SCHEMA_LOCK" >&2
            find "$HOME/kit/share" -print >&2
            exit 1
          fi
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/kit"
      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.logicalcpu)"
      - name: Smoke
        run: bash scripts/smoke.sh ./build/rcli-cxx

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Download C++ desktop kit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="RunAnywhere-cpp-desktop-windows-x64-v${SDK_VERSION}.tar.gz"
          gh release download "v${SDK_VERSION}" \
            --repo RunanywhereAI/runanywhere-sdks \
            --pattern "$asset" --dir /tmp/kit
          mkdir -p "$HOME/kit"
          tar xzf "/tmp/kit/$asset" -C "$HOME/kit" --strip-components=1
          test -f "$HOME/kit/include/runanywhere/proto/model_types.pb.h"
      - name: Configure
        shell: bash
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/kit"
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke
        shell: bash
        run: bash scripts/smoke.sh ./build/rcli.exe
