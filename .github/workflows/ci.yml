name: CI

on:
  push:
    branches: [main]
    # The release workflow stamps the formula on main; rebuilding for that
    # commit would test nothing and take most of an hour.
    paths-ignore:
      - 'Formula/**'
      - '**.md'
  pull_request:
    branches: [main]

env:
  # Keep in step with release.yml. Must contain the RAC_ROOT_DIR embeddability
  # fix (RunanywhereAI/runanywhere-sdks#753).
  SDK_REF: siddhesh/sdk-embeddable-cmake

defaults:
  run:
    working-directory: RCLI

jobs:
  build:
    # macos-26 rather than macos-14: swift/Package.swift declares
    # swift-tools-version 6.0 and the macos-14 image ships Swift 5.10, so
    # xcodebuild refuses to resolve the package at all. This is also the
    # runner line the SDK pins for its own Apple lanes, and it is arm64.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      # The directory names matter: swift/Package.swift depends on the SDK by
      # the relative path ../../runanywhere-sdks, so the SDK has to be this
      # checkout's sibling under that name.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: RCLI

      - name: Checkout the SDK
        uses: actions/checkout@v4
        with:
          repository: RunanywhereAI/runanywhere-sdks
          ref: ${{ env.SDK_REF }}
          path: runanywhere-sdks

      # core/src/generated/proto/ is gitignored, so a fresh clone carries none
      # and configure stops on the missing model_types.pb.cc.
      - name: Generate the SDK protos
        working-directory: runanywhere-sdks
        run: bash idl/codegen/generate_cpp.sh

      # Sherpa is where STT, TTS and VAD come from, and upstream ships only
      # shared libraries for macOS, so the SDK builds it from source. Without
      # this the backend configures OFF and the binary loses three modalities
      # with nothing worse than a status line to say so.
      - name: Read the pinned sherpa commit
        id: sherpa
        working-directory: runanywhere-sdks
        run: echo "commit=$(grep '^SHERPA_ONNX_COMMIT_MACOS=' core/VERSIONS | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore sherpa
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: runanywhere-sdks/core/third_party/sherpa-onnx-macos
          key: sherpa-macos-${{ runner.arch }}-${{ steps.sherpa.outputs.commit }}

      # Ten minutes or so from cold, which is why it is cached on the pinned
      # commit rather than rebuilt every run.
      - name: Build sherpa
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        working-directory: runanywhere-sdks
        run: bash core/scripts/macos/download-sherpa-onnx.sh

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DRCLI_SDK_DIR="${GITHUB_WORKSPACE}/runanywhere-sdks"

      - name: Build
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      # build/rcli-cxx is the cmake output on Apple: five engines, no MLX. The
      # name differs from the shipping binary on purpose, so a plain cmake build
      # cannot quietly replace it.
      # An engine that is linked but cannot serve this host still prints a row
      # explaining itself; one that was never compiled in prints nothing at all.
      # Only the second is a build problem, and it is the one to catch: a CI
      # runner is a VM with no Apple Neural Engine, so neurt legitimately
      # refuses to register here while still being present in the binary.
      - name: Check the five-engine binary
        run: |
          ./build/rcli-cxx --version
          ./build/rcli-cxx --help > /dev/null
          # The two streams answer two different questions. stdout lists the
          # engines that registered; stderr names the ones compiled in that
          # could not come up here. An engine absent from both was never built.
          registered=$(./build/rcli-cxx engines 2>/dev/null)
          reported=$(./build/rcli-cxx engines 2>&1)
          echo "$reported"
          for e in llamacpp neurt sherpa cloud onnx; do
            echo "$reported" | grep -q "^${e} " || { echo "::error::engine ${e} was not built in"; exit 1; }
          done
          # neurt is exempt: a CI runner is a VM with no Apple Neural Engine, so
          # it refuses to register while still shipping in the binary.
          for e in llamacpp sherpa cloud onnx; do
            echo "$registered" | grep -qE "^${e}[[:space:]]+[0-9]+" \
              || { echo "::error::engine ${e} is linked but did not register"; exit 1; }
          done

      - name: Link the shipping binary
        run: RCLI_SDK_DIR="${GITHUB_WORKSPACE}/runanywhere-sdks" scripts/build-mlx.sh

      # The difference between the two binaries is invisible until someone runs
      # an MLX model, so assert on it rather than trusting the build. Matching
      # the priority column matters: a bare "^mlx" also matches the row that
      # says MLX is linked and inert, which is the exact failure being tested.
      - name: Check MLX registered
        run: |
          ./build/rcli engines
          ./build/rcli engines 2>/dev/null | grep -qE "^mlx[[:space:]]+[0-9]+" \
            || { echo "::error::MLX is present but did not register"; exit 1; }

      # No model is downloaded here: the smallest is hundreds of megabytes, and
      # this only needs to prove the commands parse, reach the SDK and exit
      # cleanly. Generation itself is covered by the smoke suite run before a
      # release.
      - name: Smoke test
        run: |
          set -x
          ./build/rcli list
          ./build/rcli list --all > /dev/null
          ./build/rcli search qwen > /dev/null
          ./build/rcli where
          ./build/rcli config
          echo /bye | ./build/rcli run 2>/dev/null || true

      - name: Package
        run: bash scripts/package.sh

      # A release that installs but cannot find its Metal bundle is the failure
      # this catches: package.sh lays out libexec/ the way the formula does, and
      # Homebrew then symlinks bin/rcli at it.
      - name: Check the packaged binary behind a symlink
        run: |
          tarball=$(ls dist/*.tar.gz)
          staging=$(mktemp -d)
          tar xzf "${tarball}" -C "${staging}"
          root=$(ls -d "${staging}"/*/)
          mkdir -p "${root}bin"
          ln -s ../libexec/rcli "${root}bin/rcli"
          "${root}bin/rcli" engines 2>/dev/null | grep -qE "^mlx[[:space:]]+[0-9]+" \
            || { echo "::error::MLX broke when installed behind a symlink"; exit 1; }
