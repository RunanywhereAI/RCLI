name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-beta*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.5.0 — no leading v)'
        required: true

permissions:
  contents: write

env:
  WALLY_VERSION: ${{ github.event.inputs.version || github.ref_name }}

# Every platform builds two bottles from one kit: `prod` (empty bake, falls to
# the production console defaults in credentials.cpp) and `dev` (dev console
# endpoints baked in from the WALLY_DEV_* repo variables, so a dev build targets
# the dev backend with no env vars). The endpoints reach the configure step as
# environment only — never on the command line, never in committed source. The
# dev bottle's filename carries a -dev suffix; both extract to wally-<platform>.
jobs:
  macos:
    # SDK Package.swift is swift-tools-version 6.2 (Xcode 26). macos-15 is
    # Xcode 16.4 / Swift 6.1; macos-14 is Xcode 15 / Swift 5.10.
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      WALLY_SDK_SWIFT_PATH: ${{ github.workspace }}/.deps/runanywhere-sdks
      WALLY_BAKED_CONSOLE_API_URL: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_API_URL || '' }}
      WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_WEB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout SDK Swift tree (MLX runtime)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: RunanywhereAI/runanywhere-sdks
          ref: v0.20.31
          path: .deps/runanywhere-sdks
      - name: Install ninja
        run: brew install ninja
      - name: Download C++ desktop kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/fetch-kit.sh macos-arm64 "${GITHUB_WORKSPACE}/kit"
      - name: Configure + build (${{ matrix.variant }})
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/kit"
          cmake --build build -j "$(sysctl -n hw.logicalcpu)"
      - name: Product e2e
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/e2e.sh ./build/wally
      - name: Package (${{ matrix.variant }})
        run: |
          VERSION="${WALLY_VERSION#v}"
          suffix=""; [ "${{ matrix.variant }}" = dev ] && suffix="-dev"
          WALLY_VERSION="${VERSION}" WALLY_SDK_KIT="${GITHUB_WORKSPACE}/kit" \
            bash scripts/package-wally.sh build macos-arm64 "${{ matrix.variant }}"
          python3 scripts/verify-release-assets.py \
            "dist/wally-${VERSION}-macos-arm64${suffix}.tar.gz" \
            "dist/wally-${VERSION}-macos-arm64${suffix}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wally-macos-arm64-${{ matrix.variant }}
          path: dist/wally-*-macos-arm64*.tar.gz*

  windows-arm64:
    # install.ps1 already prefers wally-<ver>-windows-arm64.zip and warns when it
    # is absent; until this job existed the preferred path could never be taken
    # and every Windows-on-ARM user silently got the emulated x64 build.
    runs-on: windows-11-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      WALLY_BAKED_CONSOLE_API_URL: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_API_URL || '' }}
      WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_WEB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Download C++ desktop kit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-kit.sh windows-arm64 "${GITHUB_WORKSPACE}/kit"
      - name: Configure + build (${{ matrix.variant }})
        shell: bash
        run: |
          prefix="${GITHUB_WORKSPACE}/kit"
          if command -v cygpath >/dev/null 2>&1; then
            prefix="$(cygpath -m "$prefix")"
          fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build --config Release
      - name: Product e2e
        shell: bash
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/e2e.sh ./build/wally.exe
      - name: Package (${{ matrix.variant }})
        shell: pwsh
        run: |
          $ver = $env:WALLY_VERSION.TrimStart('v')
          $kit = Join-Path $env:GITHUB_WORKSPACE "kit"
          $env:WALLY_SDK_KIT = $kit
          $suffix = if ("${{ matrix.variant }}" -eq "dev") { "-dev" } else { "" }
          & powershell -File scripts/package-wally-windows.ps1 -BuildDir build -Version $ver -KitDir $kit -Platform windows-arm64 -Channel "${{ matrix.variant }}"
          python scripts/verify-release-assets.py `
            "dist/wally-$ver-windows-arm64$suffix.zip" `
            "dist/wally-$ver-windows-arm64$suffix.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wally-windows-arm64-${{ matrix.variant }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      WALLY_BAKED_CONSOLE_API_URL: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_API_URL || '' }}
      WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_WEB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Download C++ desktop kit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-kit.sh windows-x64 "${GITHUB_WORKSPACE}/kit"
      - name: Configure + build (${{ matrix.variant }})
        shell: bash
        run: |
          prefix="${GITHUB_WORKSPACE}/kit"
          if command -v cygpath >/dev/null 2>&1; then
            prefix="$(cygpath -m "$prefix")"
          fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build --config Release
      - name: Product e2e
        shell: bash
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/e2e.sh ./build/wally.exe
      - name: Package (${{ matrix.variant }})
        shell: pwsh
        run: |
          $ver = $env:WALLY_VERSION.TrimStart('v')
          $kit = Join-Path $env:GITHUB_WORKSPACE "kit"
          $env:WALLY_SDK_KIT = $kit
          $suffix = if ("${{ matrix.variant }}" -eq "dev") { "-dev" } else { "" }
          & powershell -File scripts/package-wally-windows.ps1 -BuildDir build -Version $ver -KitDir $kit -Channel "${{ matrix.variant }}"
          python scripts/verify-release-assets.py `
            "dist/wally-$ver-windows-x86_64$suffix.zip" `
            "dist/wally-$ver-windows-x86_64$suffix.zip.sha256"
      # Zip only. onnxruntime.dll lives next to wally.exe *inside* the archive;
      # uploading the loose DLL/exe made them look like first-class release assets.
      - uses: actions/upload-artifact@v4
        with:
          name: wally-windows-x64-${{ matrix.variant }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [prod, dev]
    env:
      WALLY_BAKED_CONSOLE_API_URL: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_API_URL || '' }}
      WALLY_BAKED_CONSOLE_WEB_ORIGIN: ${{ matrix.variant == 'dev' && vars.WALLY_DEV_CONSOLE_WEB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libcurl4-openssl-dev
      - name: Download C++ desktop kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/fetch-kit.sh linux-x64 "${GITHUB_WORKSPACE}/kit"
      - name: Configure + build (${{ matrix.variant }})
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/kit"
          cmake --build build --target wally -j "$(nproc)"
      - name: Product e2e
        env:
          WALLY_SDK_KIT: ${{ github.workspace }}/kit
        run: bash scripts/e2e.sh ./build/wally
      - name: Package (${{ matrix.variant }})
        run: |
          VERSION="${WALLY_VERSION#v}"
          suffix=""; [ "${{ matrix.variant }}" = dev ] && suffix="-dev"
          WALLY_VERSION="${VERSION}" WALLY_SDK_KIT="${GITHUB_WORKSPACE}/kit" \
            bash scripts/package-wally.sh build linux-x86_64 "${{ matrix.variant }}"
          python3 scripts/verify-release-assets.py \
            "dist/wally-${VERSION}-linux-x86_64${suffix}.tar.gz" \
            "dist/wally-${VERSION}-linux-x86_64${suffix}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: wally-linux-x86_64-${{ matrix.variant }}
          path: dist/wally-*-linux-x86_64*.tar.gz*

  publish:
    needs: [macos, windows, windows-arm64, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify release archives
        run: |
          set -euo pipefail
          VERSION="${WALLY_VERSION#v}"
          # Both bottles of every platform: prod (no suffix) and dev (-dev).
          for suffix in "" "-dev"; do
            python3 scripts/verify-release-assets.py \
              "artifacts/wally-${VERSION}-macos-arm64${suffix}.tar.gz" \
              "artifacts/wally-${VERSION}-macos-arm64${suffix}.tar.gz.sha256"
            python3 scripts/verify-release-assets.py \
              "artifacts/wally-${VERSION}-windows-x86_64${suffix}.zip" \
              "artifacts/wally-${VERSION}-windows-x86_64${suffix}.zip.sha256"
            python3 scripts/verify-release-assets.py \
              "artifacts/wally-${VERSION}-windows-arm64${suffix}.zip" \
              "artifacts/wally-${VERSION}-windows-arm64${suffix}.zip.sha256"
            python3 scripts/verify-release-assets.py \
              "artifacts/wally-${VERSION}-linux-x86_64${suffix}.tar.gz" \
              "artifacts/wally-${VERSION}-linux-x86_64${suffix}.tar.gz.sha256"
          done
      - name: Generate Homebrew formula update
        run: |
          set -euo pipefail
          VERSION="${WALLY_VERSION#v}"
          # Homebrew ships the production bottle; the dev bottle is not tapped.
          sidecar="artifacts/wally-${VERSION}-macos-arm64.tar.gz.sha256"
          digest=$(awk 'NF == 2 { print $1 }' "$sidecar")
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/stamp-formula.py "$VERSION" "macos-arm64=${digest}"
          ruby -c Formula/wally.rb
          mkdir -p release-metadata
          cp Formula/wally.rb release-metadata/wally.rb
      - uses: actions/upload-artifact@v4
        with:
          name: wally-homebrew-formula
          path: release-metadata/wally.rb
          if-no-files-found: error
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          files: |
            artifacts/wally-*.tar.gz
            artifacts/wally-*.tar.gz.sha256
            artifacts/wally-*.zip
            artifacts/wally-*.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
