name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-beta*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.5.0 — no leading v)'
        required: true

permissions:
  contents: write

env:
  RCLI_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      RCLI_SDK_SWIFT_PATH: ${{ github.workspace }}/.deps/runanywhere-sdks
    steps:
      - uses: actions/checkout@v4
      - name: Checkout SDK Swift tree (MLX runtime)
        uses: actions/checkout@v4
        with:
          repository: RunanywhereAI/runanywhere-sdks
          ref: v0.20.27
          path: .deps/runanywhere-sdks
      - name: Install ninja
        run: brew install ninja
      - name: Download C++ desktop kit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/fetch-kit.sh macos-arm64 "${GITHUB_WORKSPACE}/kit"
      - name: Configure + build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/kit"
          cmake --build build -j "$(sysctl -n hw.logicalcpu)"
      - name: Smoke product binary
        run: bash scripts/e2e.sh ./build/rcli
      - name: Package
        run: |
          VERSION="${RCLI_VERSION#v}"
          RCLI_VERSION="${VERSION}" RCLI_SDK_KIT="${GITHUB_WORKSPACE}/kit" \
            bash scripts/package-rcli.sh build macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: rcli-macos-arm64
          path: dist/rcli-*-macos-arm64.tar.gz*

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@master
      - name: Download C++ desktop kit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/fetch-kit.sh windows-x64 "${GITHUB_WORKSPACE}/kit"
      - name: Configure + build
        shell: bash
        run: |
          prefix="${GITHUB_WORKSPACE}/kit"
          if command -v cygpath >/dev/null 2>&1; then
            prefix="$(cygpath -m "$prefix")"
          fi
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build --config Release
      - name: Smoke
        shell: bash
        run: bash scripts/smoke.sh ./build/rcli.exe
      - name: Package
        shell: pwsh
        run: |
          $ver = $env:RCLI_VERSION.TrimStart('v')
          $kit = Join-Path $env:GITHUB_WORKSPACE "kit"
          $env:RCLI_SDK_KIT = $kit
          & powershell -File scripts/package-rcli-windows.ps1 -BuildDir build -Version $ver -KitDir $kit
      # Zip only. onnxruntime.dll lives next to rcli.exe *inside* the archive;
      # uploading the loose DLL/exe made them look like first-class release assets.
      - uses: actions/upload-artifact@v4
        with:
          name: rcli-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Stamp formula (best effort)
        run: |
          set -euo pipefail
          VERSION="${RCLI_VERSION#v}"
          mac=$(ls artifacts/rcli-${VERSION}-macos-arm64.tar.gz.sha256 2>/dev/null || true)
          if [[ -n "$mac" && -f scripts/stamp-formula.py ]]; then
            digest=$(awk '{print $1}' "$mac")
            python3 scripts/stamp-formula.py "$VERSION" "macos-arm64=${digest}" || true
          fi
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          files: |
            artifacts/rcli-*.tar.gz
            artifacts/rcli-*.tar.gz.sha256
            artifacts/rcli-*.zip
            artifacts/rcli-*.zip.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
