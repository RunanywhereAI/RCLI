name: Release

on:
  push:
    tags:
      - 'v*'
      # release-beta.yml owns those, and 'v*' matches them too, so without this
      # a beta tag runs both lanes and each tries to cut its own release.
      - '!v*-beta*'

permissions:
  contents: write

env:
  # The SDK ref to build against. This must contain the RAC_ROOT_DIR
  # embeddability fix (RunanywhereAI/runanywhere-sdks#753); without it cmake
  # resolves the SDK's own include paths into this repo's tree and configure
  # fails. Move this to a release tag once that PR lands, so a release builds
  # from a fixed point rather than a moving branch.
  SDK_REF: siddhesh/sdk-embeddable-cmake

defaults:
  run:
    working-directory: RCLI

jobs:
  build:
    # macos-26, matching the SDK's Apple lanes: the macos-14 image ships
    # Swift 5.10 and swift/Package.swift needs 6.0, so xcodebuild cannot
    # resolve the package there. arm64, which is what this binary targets.
    runs-on: macos-26
    steps:
      # Both repos are checked out side by side, and the directory names matter:
      # swift/Package.swift depends on the SDK by the relative path
      # ../../runanywhere-sdks, so the SDK has to be this checkout's sibling
      # under the same name. This is also the local development layout, which is
      # why it is mirrored rather than special-cased.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: RCLI

      - name: Checkout the SDK
        uses: actions/checkout@v4
        with:
          repository: RunanywhereAI/runanywhere-sdks
          ref: ${{ env.SDK_REF }}
          path: runanywhere-sdks

      # core/src/generated/proto/ is gitignored, so a fresh clone carries none
      # and rcli's configure stops on the missing model_types.pb.cc. The script
      # bootstraps its own pinned protoc.
      - name: Generate the SDK protos
        working-directory: runanywhere-sdks
        run: bash idl/codegen/generate_cpp.sh

      # STT, TTS and VAD come from sherpa, and upstream ships only shared
      # libraries for macOS, so the SDK builds it from source. Without this the
      # backend configures OFF and the release quietly loses three modalities.
      - name: Read the pinned sherpa commit
        id: sherpa
        working-directory: runanywhere-sdks
        run: echo "commit=$(grep '^SHERPA_ONNX_COMMIT_MACOS=' core/VERSIONS | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Restore sherpa
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: runanywhere-sdks/core/third_party/sherpa-onnx-macos
          key: sherpa-macos-${{ runner.arch }}-${{ steps.sherpa.outputs.commit }}

      - name: Build sherpa
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        working-directory: runanywhere-sdks
        run: bash core/scripts/macos/download-sherpa-onnx.sh

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DRCLI_SDK_DIR="${GITHUB_WORKSPACE}/runanywhere-sdks"

      # Produces build/rcli-cxx: five engines, no MLX. Not the binary that
      # ships, but build-mlx.sh harvests its link line, so it has to exist.
      - name: Build
        run: cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      # MLX inference is Swift, and SwiftPM on the command line cannot compile
      # Metal shaders, so only xcodebuild produces the six-engine binary.
      - name: Link the shipping binary
        run: RCLI_SDK_DIR="${GITHUB_WORKSPACE}/runanywhere-sdks" scripts/build-mlx.sh

      # Every engine must be built in. Matching the priority column separates
      # an engine that registered from one that is linked and inert, which is
      # the difference a release must not get wrong. neurt is exempt from the
      # second check: a CI runner is a VM with no Apple Neural Engine, so it
      # refuses to register here while still shipping in the binary.
      - name: Verify every engine registered
        run: |
          # stdout lists the engines that registered; stderr names the ones
          # compiled in that could not come up on this host. Absent from both
          # means never built.
          registered=$(./build/rcli engines 2>/dev/null)
          reported=$(./build/rcli engines 2>&1)
          echo "$reported"
          for e in mlx llamacpp neurt sherpa cloud onnx; do
            echo "$reported" | grep -q "^${e} " || { echo "::error::engine ${e} was not built in"; exit 1; }
          done
          # neurt is exempt: the runner is a VM with no Apple Neural Engine, so
          # it refuses to register while still shipping in the binary.
          for e in mlx llamacpp sherpa cloud onnx; do
            echo "$registered" | grep -qE "^${e}[[:space:]]+[0-9]+" \
              || { echo "::error::engine ${e} is linked but did not register"; exit 1; }
          done

      - name: Package
        id: package
        run: |
          bash scripts/package.sh
          TARBALL=$(ls dist/*.tar.gz)
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${TARBALL}")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "${TARBALL}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: RCLI/dist/*.tar.gz
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            brew tap RunanywhereAI/rcli https://github.com/RunanywhereAI/RCLI.git
            brew install runanywhereai/rcli/rcli
            ```

            The name is spelled out because `runanywhereai/tap` also provides a
            formula called `rcli`.

            Apple Silicon macOS. Models download on demand into
            `~/.local/share/runanywhere`.

            ### sha256
            ```
            ${{ steps.package.outputs.sha256 }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Homebrew reads a tap's formula from the default branch, not from the
      # tag, so a release is only installable once main points at it. Doing this
      # by hand is what left the sha256 as a placeholder before.
      - name: Point the formula at this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Move to main before stamping, not after: the tag is checked out
          # detached, and switching branches with the formula already edited
          # either conflicts or silently discards the edit.
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/stamp-formula.py \
            "${VERSION}" \
            "${{ steps.package.outputs.name }}" \
            "${{ steps.package.outputs.sha256 }}"
          git add Formula/rcli.rb
          git commit -m "release: point the formula at v${VERSION}"
          git push origin main
