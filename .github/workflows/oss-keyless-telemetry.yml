# =============================================================================
# OSS keyless telemetry gate — wally development → public staging backend
# =============================================================================
# Primary CI for the open-source contract: consume a published C++ desktop kit,
# build wally, and keyless-blast all 12 modalities at the staging backend
# (PUBLIC org). No API key. Staging origin comes from repo secrets/vars —
# not hardcoded hosts.
#
# Intentionally NOT on pull_request — each run writes real events into staging
# and would dirty the DB under PR load. Daily + manual only.
# =============================================================================

name: OSS keyless telemetry

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  keyless-staging-blast:
    name: wally keyless → staging backend
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ninja
        run: brew install ninja

      - name: Resolve staging backend origin
        id: origin
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          RA_OSS_BASE_URL: ${{ vars.RA_OSS_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${STAGING_BASE_URL:-}" && -z "${RA_OSS_BASE_URL:-}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_BASE_URL / RA_OSS_BASE_URL not set; skipping the OSS keyless blast (nothing to hit)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch kit + build wally + keyless blast
        if: steps.origin.outputs.skip != 'true'
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          RA_OSS_BASE_URL: ${{ vars.RA_OSS_BASE_URL || secrets.STAGING_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/oss_keyless_telemetry_blast.sh
