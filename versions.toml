# The one place every version and pin in this repo lives.
#
# CMake reads this file directly (cmake/sdk-pin.cmake and the top of
# CMakeLists.txt), so a build takes its product version and its SDK pins from
# here and nowhere else. The copies that cannot read TOML at their own build
# step -- the Homebrew formula's version line, the Swift package's exact SDK pin
# -- are checked against this file by scripts/check-versions.py, which the CI
# distribution job and Work-Space-Scripts/ci-cd-sim/scripts/rcli.sh both run, so
# a drift fails the build rather than shipping.
#
# Format is deliberately flat: `key = "value"`, one per line, no nesting inside
# a value, because it is parsed by a regex on both the CMake and the Python side.
# Keep it that way.

[product]
# The CLI's own release version. Bumped for a wally release, independent of the
# SDK kit below. The git tag is v<version>; auto-tag.yml reads it from here.
version = "0.5.3"

[sdk]
# The published C++ desktop kit this tree is validated against. Bump together
# with the kit SHAs after an SDK release; see cmake/sdk-pin.cmake's own header
# for why the IDL pin moves the way it does.
kit_version = "0.20.34"
idl_version = "1.1.1"
idl_schema_sha256 = "ec50b7ca4beff9fa065c5ae1f12dbbc0c996d8b43e64c44bf350ef86a1fa41aa"
idl_protoc_version = "35.1"
kit_sha256_macos_arm64 = "8bf2019b27f10001b33d78338b5dcf78a14977c70fcded3f8a3e0647ca8da188"
kit_sha256_windows_x64 = "d472ada77c67bdf4445cd0ba12cb029e9f9cc3ff09937b18fe8025d5e28e5c6f"
kit_sha256_windows_arm64 = "4d1984ec8c3867a2fe23ed660e586b5ff8515b31211acf8eff7144dfee9cea22"

[swift]
# The Swift SDK package the Apple MLX host resolves (swift/Package.swift). This
# is a different artifact from the C++ kit above and moves on its own cadence;
# it is tracked here only so the two are visible side by side and a check can
# catch Package.swift drifting away from this value.
sdk_package_version = "0.20.25"
tools_version = "6.0"
# The runanywhere-sdks tag CI and the release workflow check out to build the
# Apple MLX host (the `ref:` in ci.yml and release.yml). A third SDK reference,
# distinct from the package pin above and the C++ kit -- tracked here so all
# three are visible in one place and check-versions.py catches the workflows
# drifting from it.
sdk_ci_ref = "0.20.31"

[toolchain]
# Build-floor constants, tracked for visibility. CMakeLists.txt still declares
# cmake_minimum_required and the C++ standard itself; these mirror them.
cmake_minimum = "3.24"
cxx_standard = "20"
